# Builds the signed APK and publishes it with the download page on Cloudflare.
# Run it by pushing a tag that matches pubspec.yaml (e.g. version: 1.0.1+2 -> tag v1.0.1),
# or by hand from the Actions tab ("Run workflow").
#
# Required repository secrets:
#   KEYSTORE_BASE64      base64 -w0 tchip-release.jks
#   KEYSTORE_PASSWORD    store password
#   KEY_PASSWORD         key password
#   KEY_ALIAS            key alias (tchip)
#   CLOUDFLARE_API_TOKEN token with "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "v${version%%+*}" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            [[ -n "${!v}" ]] || { echo "Secret $v is missing" >&2; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/tchip-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=tchip-release.jks
          EOF

      - name: Build APK and deploy download page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          tool/deploy_download.sh 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            # Surface the end of the log as an annotation, readable without opening the job.
            msg=$(grep -v '^\s*$' deploy.log | tail -n 40 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build or deploy failed::$msg"
          fi
          exit $status

      - uses: actions/upload-artifact@v5
        with:
          name: tchip-apk
          path: build/download/tchip.apk
          retention-days: 30

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/download/tchip.apk "tchip-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "tchip-$GITHUB_REF_NAME.apk" \
            --title "Tchip ! $GITHUB_REF_NAME" --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f android/app/tchip-release.jks android/key.properties
