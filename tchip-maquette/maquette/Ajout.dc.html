<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tchip, ajout d'une dépense en espèces</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#0b0b0b}
a{color:#E8B931}a:hover{color:#F3CF5F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 28px; background: #121212; color: #F2F2F2; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 12px; background: #1B1B1B; border: 1px solid #262626; color: #F2F2F2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
<div style="font-size: 18px; font-weight: 600">Dépense en espèces</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 0 8px">
<label for="montant" style="font-size: 13px; color: #9A9A9A">Montant</label>
<div style="display: flex; align-items: baseline; gap: 8px">
<input id="montant" inputmode="numeric" value="500" style="width: 190px; background: transparent; border: 0; outline: none; text-align: right; color: #F2F2F2; font: 600 52px 'Geist Mono', monospace; letter-spacing: -0.03em">
<span style="font-size: 22px; color: #9A9A9A">FCFA</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 600">Catégorie</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}"><span style="width: 8px; height: 8px; border-radius: 999px; background: {{c.color}}"></span>{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="date" style="font-size: 14px; font-weight: 600">Date</label>
<input id="date" value="Lundi 12 octobre 2026" style="height: 48px; padding: 0 14px; border-radius: 12px; background: #1B1B1B; border: 1px solid #2E2E2E; color: #F2F2F2; font: 400 15px 'Geist', sans-serif">
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="note" style="font-size: 14px; font-weight: 600">Note <span style="font-weight: 400; color: #9A9A9A">(facultatif)</span></label>
<input id="note" placeholder="Ex. : garba au campus" style="height: 48px; padding: 0 14px; border-radius: 12px; background: #1B1B1B; border: 1px solid #2E2E2E; color: #F2F2F2; font: 400 15px 'Geist', sans-serif">
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; color: #9A9A9A; text-align: center">Reste aujourd'hui en Nourriture après ajout : 300 F</div>
<a href="Main.dc.html" style="height: 52px; border-radius: 14px; background: #E8B931; color: #1F1B10; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Enregistrer la dépense</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { c: 'Nourriture' }; }
  renderVals() {
    var self = this;
    var list = [['Nourriture', '#7FB7FF'], ['Transport', '#C79BFF'], ['Forfaits', '#5FD0C4'], ['Famille', '#FF9DB8'], ['Loisirs', '#D7C96A'], ['Autre', '#9A9A9A']];
    return {
      cats: list.map(function (x) {
        var on = self.state.c === x[0];
        return {
          label: x[0], color: x[1], on: on ? 'true' : 'false',
          pick: function () { self.setState({ c: x[0] }); },
          style: 'height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 14px Geist, sans-serif; ' + (on ? 'background: #FBF1D3; color: #1F1B10; border: 1px solid #E8B931' : 'background: #1B1B1B; color: #D0D0D0; border: 1px solid #2E2E2E')
        };
      })
    };
  }
}
</script>
</body>
</html>
