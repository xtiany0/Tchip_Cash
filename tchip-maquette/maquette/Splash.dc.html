<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0b0b}
@keyframes tchipIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes tchipBang{0%{opacity:0;transform:translateY(-60px)}40%{opacity:1;transform:translateY(0)}60%{transform:translateY(-16px)}80%{transform:translateY(0)}90%{transform:translateY(-4px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tchipMsg{from{opacity:0}to{opacity:1}}
@keyframes tchipDomino{0%{transform:rotate(0)}12%{transform:rotate(16deg)}26%{transform:rotate(0)}100%{transform:rotate(0)}}
.tl,.tb{transform-origin:85% 95%}
.tl{display:inline-block;opacity:0;animation:tchipIn 0.35s ease-out forwards,tchipDomino 1.8s ease-in-out infinite}
.tb{display:inline-block;opacity:0;color:#E8B931;animation:tchipBang 0.6s ease-out 0.5s forwards,tchipDomino 1.8s ease-in-out 2.3s infinite}
.tm{opacity:0;animation:tchipMsg 0.6s ease-out 1.1s forwards}
@media (prefers-reduced-motion: reduce){.tl,.tb,.tm{animation:none;opacity:1}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121212; color: #F2F2F2; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; position: relative">
<div aria-label="Tchip !" style="font-size: 64px; font-weight: 700; letter-spacing: -0.03em; display: flex; align-items: baseline">

</div>
<div class="tm" style="font-size: 17px; font-weight: 500; color: #D0D0D0; text-align: center; max-width: 280px; line-height: 1.4">Tes finances sous contrôle.</div>
<div style="position: absolute; bottom: 64px; font-size: 13px; color: #9A9A9A">Chargement de tes opérations…</div>
</div>
