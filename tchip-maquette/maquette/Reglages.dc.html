<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tchip !, réglages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#0b0b0b}
a{color:#E8B931}a:hover{color:#F3CF5F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 28px; background: #121212; color: #F2F2F2; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 12px; background: #1B1B1B; border: 1px solid #262626; color: #F2F2F2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></a>
<div style="font-size: 18px; font-weight: 600">{{t.titre}}</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; color: #9A9A9A; text-transform: uppercase; letter-spacing: 0.06em">{{t.langue}}</div>
<div role="radiogroup" aria-label="{{t.langue}}" style="border-radius: 16px; background: #1B1B1B; border: 1px solid #262626; padding: 0 16px">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<button role="radio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; background: transparent; border: 0; border-bottom: {{l.border}}; color: #F2F2F2; text-align: left; font: 400 15px Geist, sans-serif; padding: 0">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span>{{l.label}}</span><span style="font-size: 12px; color: #9A9A9A">{{l.sub}}</span></span>
<span style="{{l.ring}}"><span style="{{l.dot}}"></span></span>
</button>
</sc-for>
</div>
<div style="font-size: 12px; color: #9A9A9A">{{t.format}}</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; color: #9A9A9A; text-transform: uppercase; letter-spacing: 0.06em">{{t.ops}}</div>
<div style="border-radius: 16px; background: #1B1B1B; border: 1px solid #262626; padding: 0 16px">
<div style="display: flex; align-items: center; min-height: 52px; border-bottom: 1px solid #262626; font-size: 15px"><span style="flex-grow: 1">MTN MoMo</span><span style="font-size: 13px; color: #4CC28A">{{t.actif}}</span></div>
<div style="display: flex; align-items: center; min-height: 52px; border-bottom: 1px solid #262626; font-size: 15px"><span style="flex-grow: 1">Moov Money</span><span style="font-size: 13px; color: #4CC28A">{{t.actif}}</span></div>
<div style="display: flex; align-items: center; min-height: 52px; font-size: 15px"><span style="flex-grow: 1">Celtiis Cash</span><span style="font-size: 13px; color: #4CC28A">{{t.actif}}</span></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; color: #9A9A9A; text-transform: uppercase; letter-spacing: 0.06em">{{t.donnees}}</div>
<div style="border-radius: 16px; background: #1B1B1B; border: 1px solid #262626; padding: 0 16px">
<div style="display: flex; align-items: center; min-height: 52px; border-bottom: 1px solid #262626; font-size: 15px"><span style="flex-grow: 1">{{t.regles}}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 52px; font-size: 14px; color: #D0D0D0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8B931" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>{{t.local}}</div>
</div>
</div>

<div style="margin-top: auto; text-align: center; font-size: 12px; color: #9A9A9A">Tchip ! v1.0.0 (1)</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { l: 'auto' }; }
  renderVals() {
    var self = this;
    var en = this.state.l === 'en';
    var t = en
      ? { titre: 'Settings', langue: 'Language', format: 'Amounts and dates follow the chosen language: 12,500 F · Oct 12.', ops: 'Tracked operators', actif: 'On', donnees: 'Data', regles: 'Categories and rules', local: 'Everything stays on this phone' }
      : { titre: 'Réglages', langue: 'Langue', format: 'Montants et dates suivent la langue choisie : 12 500 F · 12 oct.', ops: 'Opérateurs suivis', actif: 'Actif', donnees: 'Données', regles: 'Catégories et règles', local: 'Tout reste sur ce téléphone' };
    var opts = [['auto', en ? 'Automatic' : 'Automatique', en ? 'Phone language (French)' : 'Langue du téléphone (français)'], ['fr', 'Français', ''], ['en', 'English', '']];
    return {
      t: t,
      langs: opts.map(function (o, i) {
        var on = self.state.l === o[0];
        return { label: o[1], sub: o[2], on: on ? 'true' : 'false', border: i < 2 ? '1px solid #262626' : '0',
          pick: function () { self.setState({ l: o[0] }); },
          ring: 'width: 22px; height: 22px; flex-shrink: 0; border-radius: 999px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid ' + (on ? '#E8B931' : '#555555'),
          dot: 'width: 10px; height: 10px; border-radius: 999px; background: ' + (on ? '#E8B931' : 'transparent') };
      })
    };
  }
}
</script>
</body>
</html>
