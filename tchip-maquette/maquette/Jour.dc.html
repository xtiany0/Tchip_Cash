<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tchip !, écran du jour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#0b0b0b}
a{color:#E8B931}a:hover{color:#F3CF5F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121212; color: #F2F2F2; font-family: 'Geist', system-ui, sans-serif; position: relative; overflow: hidden">
<div style="padding: 24px 20px 110px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 12px; background: #1B1B1B; border: 1px solid #262626; color: #F2F2F2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 18px; font-weight: 600">Aujourd'hui</div>
<div style="font-size: 12px; color: #9A9A9A">Plan Semaine de cours</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{jours}}" as="j" hint-placeholder-count="7">
<button onClick="{{j.pick}}" aria-pressed="{{j.on}}" style="{{j.style}}"><span style="font-size: 11px">{{j.d}}</span><span style="font-size: 15px; font-weight: 600">{{j.n}}</span><span style="width: 5px; height: 5px; border-radius: 999px; background: {{j.dot}}"></span></button>
</sc-for>
</div>

<div style="padding: 18px; border-radius: 20px; background: #1B1B1B; border: 1px solid #262626; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; color: #B5B5B5">{{titre}}</div>
<div style="display: flex; align-items: baseline; gap: 8px">
<div style="font-family: 'Geist Mono', monospace; font-size: 36px; font-weight: 600; letter-spacing: -0.03em">{{spent}}</div>
<div style="font-size: 15px; color: #9A9A9A">/ {{cap}}</div>
</div>
<div style="font-size: 14px; color: #4CC28A">{{reste}}</div>
<sc-if value="{{special}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: #FBF1D3; color: #1F1B10; font-size: 13px; line-height: 1.4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"></path></svg><span><b>Plafond ponctuel.</b> Loisirs passe à 5 000 F ce samedi, à la place des 800 F habituels.</span></div>
</sc-if>
</div>

<div style="font-size: 16px; font-weight: 600">Par catégorie</div>
<div style="padding: 4px 16px; border-radius: 16px; background: #1B1B1B; border: 1px solid #262626; display: flex; flex-direction: column; margin-top: -8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
<div style="padding: 14px 0; display: flex; flex-direction: column; gap: 8px; border-bottom: {{c.border}}">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 15px"><span style="width: 8px; height: 8px; border-radius: 999px; background: {{c.color}}"></span>{{c.nom}}</div>
<div style="font-family: 'Geist Mono', monospace; font-size: 13px; color: #D0D0D0">{{c.val}}</div>
</div>
<div style="height: 6px; border-radius: 999px; background: #2A2A2A"><div style="height: 6px; border-radius: 999px; width: {{c.w}}; background: {{c.bar}}"></div></div>
<div style="font-size: 12px; color: {{c.resteColor}}">{{c.reste}}</div>
</div>
</sc-for>
</div>

</div>

<nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 12px 18px; background: #161616; border-top: 1px solid #262626; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; text-decoration: none; color: #E8B931"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
<a href="Operations.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; text-decoration: none; color: #9A9A9A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Opérations</a>
<a href="Ajout.dc.html" aria-label="Ajouter une dépense en espèces" style="justify-self: center; width: 52px; height: 52px; border-radius: 18px; background: #E8B931; color: #1F1B10; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
<a href="Bilan.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; text-decoration: none; color: #9A9A9A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12A9 9 0 1 1 12 3v9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>Bilan</a>
<a href="Budget.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; text-decoration: none; color: #9A9A9A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>Plans</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { j: 0 }; }
  renderVals() {
    var self = this;
    var d = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
    var sat = this.state.j === 5;
    var row = function (nom, color, used, cap, last) {
      var pct = Math.min(100, Math.round(used / cap * 100));
      var bar = used > cap ? '#D64545' : pct >= 80 ? '#E07A2E' : '#2E9E6A';
      var f = function (n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); };
      return { nom: nom, color: color, val: f(used) + ' / ' + f(cap) + ' F', w: pct + '%', bar: bar,
        reste: used > cap ? 'Dépassé de ' + f(used - cap) + ' F' : 'Reste ' + f(cap - used) + ' F',
        resteColor: used > cap ? '#F07070' : pct >= 80 ? '#F0954F' : '#9A9A9A',
        border: last ? '0' : '1px solid #262626' };
    };
    return {
      jours: d.map(function (x, i) {
        var on = self.state.j === i;
        return { d: x, n: String(12 + i), on: on ? 'true' : 'false', dot: i === 5 ? '#E8B931' : 'transparent',
          pick: function () { self.setState({ j: i }); },
          style: 'height: 64px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: Geist, sans-serif; ' + (on ? 'background: #E8B931; color: #1F1B10; border: 1px solid #E8B931' : 'background: #1B1B1B; color: #D0D0D0; border: 1px solid #262626') };
      }),
      titre: this.state.j === 0 ? 'Dépensé aujourd’hui' : 'Prévu ce ' + ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'][this.state.j],
      spent: this.state.j === 0 ? '2 700 F' : '0 F',
      cap: sat ? '8 200 F' : '4 000 F',
      reste: this.state.j === 0 ? 'Reste 1 300 F pour aujourd’hui' : 'Tout le plafond du jour est disponible',
      special: sat,
      cats: this.state.j === 0
        ? [row('Nourriture', '#7FB7FF', 1200, 2000), row('Transport', '#C79BFF', 1000, 1200), row('Loisirs', '#D7C96A', 500, 800, true)]
        : [row('Nourriture', '#7FB7FF', 0, 2000), row('Transport', '#C79BFF', 0, 1200), row('Loisirs', '#D7C96A', 0, sat ? 5000 : 800, true)]
    };
  }
}
</script>
</body>
</html>
